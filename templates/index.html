<!DOCTYPE html>
<html>
  <head>
    <title>Upload Image</title>
    <link
      href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      .placeholder-image {
        width: 90%; /* Adjusted width to 80% */
        height: auto;
        display: block;
        margin: 0 auto; /* Center the image */
      }
      .upload-container {
        text-align: center;
        margin-top: 20px;
        position: relative;
      }
      .centered-button {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        padding: 15px 30px; /* Increased padding for a larger button */
        font-size: 48px; /* Increased font size */
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1 class="text-center mt-5" id="form-title">Upload an Image</h1>
      <div class="upload-container">
        <form
          id="uploadForm"
          action="/demo"
          method="post"
          enctype="multipart/form-data"
        >
          <div class="form-group">
            <input
              type="file"
              name="image"
              id="fileInput"
              class="form-control-file"
              style="display: none"
            />
            <img
              id="placeholder"
              src="static/placeholder.png"
              class="placeholder-image"
              alt="Placeholder"
            />
            <button
              type="button"
              class="btn btn-primary centered-button"
              id="chooseFileButton"
            >
              Choose File
            </button>
          </div>
        </form>
      </div>
    </div>

    <script>
      document
        .getElementById("chooseFileButton")
        .addEventListener("click", function () {
          document.getElementById("fileInput").click();
        });

      document
        .getElementById("fileInput")
        .addEventListener("change", function (event) {
          var input = event.target;
          if (input.files && input.files[0]) {
            var reader = new FileReader();
            reader.onload = function (e) {
              document.getElementById("placeholder").src = e.target.result;
              document.getElementById("chooseFileButton").style.display =
                "none";
              document.getElementById("form-title").innerText = "Processing...";
              document.getElementById("uploadForm").submit();
            };
            reader.readAsDataURL(input.files[0]);
          }
        });
    </script>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
  </body>
</html>
